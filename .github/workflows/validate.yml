name: Validate Astro comparison
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run security:audit
      - name: Check survey story aggregation with synthetic data
        run: python3 -m unittest discover -s scripts/survey-story -p 'test_*.py'
      - run: npm run check
      - run: node --test scripts/tests/*.test.mjs
      - run: npm run build
