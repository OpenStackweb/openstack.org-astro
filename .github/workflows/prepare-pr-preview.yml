name: Prepare requested PR preview
run-name: 'Preview PR #${{ inputs.pr }} at ${{ inputs.head }}'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number targeting this repository
        required: true
        type: string
      head:
        description: Reviewed pull request head SHA
        required: true
        type: string
      base:
        description: Current main SHA when requested
        required: true
        type: string
permissions:
  contents: write
  pull-requests: read
  actions: write
concurrency:
  group: prepare-editorial-pr-preview
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'OpenStackweb/openstack.org-astro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Prepare content-only review branch using trusted main code
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.pr }}
          PREVIEW_HEAD: ${{ inputs.head }}
          PREVIEW_BASE: ${{ inputs.base }}
        run: node scripts/prepare-pr-preview.mjs
